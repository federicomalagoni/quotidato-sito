<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quotidatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Logo Badge -->
  <rect x="2" y="4" width="40" height="40" rx="10" fill="url(#quotidatoGrad)"/>
  <!-- Radar circles & crosshair -->
  <circle cx="22" cy="24" r="14" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.35" fill="none"/>
  <circle cx="22" cy="24" r="8" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" fill="none"/>
  <circle cx="22" cy="24" r="3" fill="#ffffff"/>
  <line x1="22" y1="7" x2="22" y2="13" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="35" x2="22" y2="41" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="5" y1="24" x2="11" y2="24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="33" y1="24" x2="39" y2="24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Wordmark "Quotidato" -->
  <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="21" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">Quotidato</text>
  <!-- Subtitle -->
  <text x="53" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#0284c7" letter-spacing="0.08em" text-transform="uppercase">SALES ASSISTANT</text>
