<svg width="240" height="48" viewBox="0 0 240 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sfondo verde pino nobile -->
    <linearGradient id="qLogoPine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17483c"/>
      <stop offset="100%" stop-color="#0d2c24"/>
    </linearGradient>
    <!-- Coda radar in oro SuperPino -->
    <linearGradient id="qLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d99b26"/>
    </linearGradient>
  </defs>

  <!-- Badge Squircle -->
  <rect x="2" y="4" width="40" height="40" rx="11" fill="url(#qLogoPine)"/>
  <rect x="2.5" y="4.5" width="39" height="39" rx="10.5" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.18"/>

  <!-- Cerchi radar e mirino centrale -->
  <circle cx="22" cy="24" r="14" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" fill="none"/>
  <circle cx="22" cy="24" r="8" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.75" fill="none"/>
  <circle cx="22" cy="24" r="3" fill="#fde047"/>
  <line x1="22" y1="7" x2="22" y2="12" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22" y1="36" x2="22" y2="41" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="5" y1="24" x2="10" y2="24" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="34" y1="24" x2="39" y2="24" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Wordmark Quotidato -->
  <text x="54" y="28" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#141b18" letter-spacing="-0.02em">Quotidato</text>
  <!-- Tagline -->
  <text x="55" y="40" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#17483c" letter-spacing="0.08em">RADAR PER STUDI</text>
</svg>
