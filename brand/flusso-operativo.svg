<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: block; max-width: 100%;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="headerNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="860" height="260" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- STEP 1: FONTI UFFICIALI (LA BUROCRAZIA) -->
  <g transform="translate(30, 30)">
    <rect width="230" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- Top badge -->
    <rect x="16" y="16" width="105" height="20" rx="3" fill="#f1f5f9"/>
    <text x="22" y="30" font-size="10" font-weight="700" fill="#64748b" font-family="'JetBrains Mono', monospace">FONTI UFFICIALI</text>
    
    <text x="16" y="60" font-size="15" font-weight="700" fill="#0f172a" font-family="'Merriweather', Georgia, serif">Bandi & Albo Pretorio</text>
    <text x="16" y="78" font-size="12" fill="#64748b">Regione · CCIAA · Comuni</text>
    
    <!-- Mini doc lines mimicking bureaucratic PDF -->
    <rect x="16" y="96" width="198" height="6" rx="2" fill="#e2e8f0"/>
    <rect x="16" y="108" width="170" height="6" rx="2" fill="#e2e8f0"/>
    <rect x="16" y="120" width="190" height="6" rx="2" fill="#e2e8f0"/>
    <rect x="16" y="132" width="140" height="6" rx="2" fill="#e2e8f0"/>
    
    <rect x="16" y="156" width="198" height="28" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="24" y="174" font-size="11" font-weight="600" fill="#991b1b">Oltre 40 pag. di atti e delibere</text>
  </g>

  <!-- ARROW 1 -->
  <path d="M 275 130 L 305 130" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- STEP 2: IL MOTORE QUOTIDATO -->
  <g transform="translate(320, 20)">
    <rect width="220" height="220" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- Header banner -->
    <path d="M 0 8 Q 0 0 8 0 L 212 0 Q 220 0 220 8 L 220 40 L 0 40 Z" fill="url(#headerNavy)"/>
    <text x="110" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">FILTRO QUOTIDATO</text>
    
    <!-- Checklist items inside Quotidato -->
    <g transform="translate(18, 56)">
      <!-- Item 1 -->
      <circle cx="10" cy="10" r="10" fill="#ecfdf5"/>
      <path d="M 7 10 L 9 12 L 13 8" stroke="#059669" stroke-width="1.8" fill="none"/>
      <text x="28" y="14" font-size="12" font-weight="700" fill="#0f172a">Incrocio Codici ATECO</text>
      <text x="28" y="28" font-size="10.5" fill="#64748b">Solo clienti dello studio</text>

      <!-- Item 2 -->
      <circle cx="10" cy="46" r="10" fill="#ecfdf5"/>
      <path d="M 7 46 L 9 48 L 13 44" stroke="#059669" stroke-width="1.8" fill="none"/>
      <text x="28" y="50" font-size="12" font-weight="700" fill="#0f172a">Verifica Requisiti & Plafond</text>
      <text x="28" y="64" font-size="10.5" fill="#64748b">Sportello aperto a Mantova</text>

      <!-- Item 3 -->
      <circle cx="10" cy="82" r="10" fill="#ecfdf5"/>
      <path d="M 7 82 L 9 84 L 13 80" stroke="#059669" stroke-width="1.8" fill="none"/>
      <text x="28" y="86" font-size="12" font-weight="700" fill="#0f172a">Traduzione Operativa</text>
      <text x="28" y="100" font-size="10.5" fill="#64748b">Importo, contributo, scadenze</text>

      <!-- Item 4 -->
      <circle cx="10" cy="118" r="10" fill="#ecfdf5"/>
      <path d="M 7 118 L 9 120 L 13 116" stroke="#059669" stroke-width="1.8" fill="none"/>
      <text x="28" y="122" font-size="12" font-weight="700" fill="#0f172a">Supervisione Territoriale</text>
      <text x="28" y="136" font-size="10.5" fill="#64748b">Controllo umano pre-invio</text>
    </g>
  </g>

  <!-- ARROW 2 -->
  <path d="M 555 130 L 585 130" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- STEP 3: LA NOTA PER IL CLIENTE -->
  <g transform="translate(600, 30)">
    <rect width="230" height="200" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" filter="url(#cardShadow)"/>
    
    <!-- Top badge -->
    <rect x="16" y="16" width="126" height="20" rx="3" fill="#ecfdf5"/>
    <text x="22" y="30" font-size="10" font-weight="700" fill="#065f46" font-family="'JetBrains Mono', monospace">PRONTO ALL'INOLTRO</text>
    
    <text x="16" y="60" font-size="15" font-weight="700" fill="#0f172a" font-family="'Merriweather', Georgia, serif">Nota per il Cliente</text>
    <text x="16" y="76" font-size="11.5" fill="#64748b">10 righe · Email o WhatsApp</text>
    
    <!-- Message preview box -->
    <rect x="16" y="90" width="198" height="66" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="106" font-size="10.5" fill="#334155">«Gentile [Cliente], se acquisti</text>
    <text x="24" y="122" font-size="10.5" font-weight="700" fill="#0f172a">macchinari recuperi il 50%</text>
    <text x="24" y="138" font-size="10.5" fill="#334155">a fondo perduto fino a 8.000€...»</text>
    
    <rect x="16" y="164" width="198" height="24" rx="3" fill="#0f172a"/>
    <text x="115" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Firma del tuo Studio</text>
  </g>
</svg>
